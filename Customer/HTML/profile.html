<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - ZP Badminton</title>
    <link rel="icon" type="image/x-icon" href="../HinhAnh/Logo.ico">
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="../CSS/profile.css">
    <link rel="stylesheet" href="../CSS/product-detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="login-header">
        <a href="index.html" class="logo">
            <img src="../HinhAnh/Logo_hinh.jpg" alt="ZP Badminton">
            <span>ZP Badminton</span>
        </a>
    </header>

    <main class="login-container">
        <section class="login-box" style="max-width: 520px;">
            <div class="login-title">
                <h1>Thông tin cá nhân</h1>
                <p>Xem / chỉnh sửa thông tin tài khoản của bạn</p>
            </div>

            <form id="profileForm">
                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <div class="input-box">
                        <input type="text" id="fullName" value="Nguyễn Văn A" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-box">
                        <input type="email" id="email" value="nguyenvana@gmail.com" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <div class="input-box">
                        <input type="tel" id="phone" value="0901234567" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Địa chỉ mặc định</label>
                    <div class="input-box">
                        <input type="text" id="address" value="123 Nguyễn Trãi, Quận 5, TP.HCM">
                    </div>
                </div>

                <!-- Đã sửa: Nút submit chuẩn HTML, không bọc thẻ <a> -->
                <button type="submit" class="login-button">
                    Lưu cài đặt
                </button>
            </form>


            <div class="profile-actions">
                <a href="index.html" class="profile-action-btn btn-home">
                    <i class="fa-solid fa-house"></i>
                    <span>Quay về trang chủ</span>
                    <i class="fa-solid fa-arrow-right action-arrow"></i>
                </a>

                <a href="orders.html" class="profile-action-btn btn-orders">
                    <i class="fa-solid fa-box-open"></i>
                    <span>Xem đơn hàng</span>
                    <i class="fa-solid fa-arrow-right action-arrow"></i>
                </a>
            </div>

        </section>
    </main>

    <!-- Thêm: Khung thông báo Toast ẩn -->
    <div id="toastNotification" class="toast-notification">
        <div class="toast-icon">✓</div>
        <div class="toast-message">Đã lưu cài đặt thành công!</div>
    </div>

    <!-- Nhúng cart.js để dùng hàm showToast sẵn có -->
    <script src="../JS/cart.js"></script>
    <script>
        document.getElementById("profileForm").addEventListener("submit", function (e) {
            e.preventDefault(); // Ngăn load lại trang ngay lập tức

            // Kích hoạt Toast thông báo
            if (typeof showToast === "function") {
                showToast("Đã lưu thông tin cài đặt thành công!");
            } else {
                alert("Đã lưu thông tin cài đặt thành công!");
            }

            // Đợi 1.5 giây cho người dùng thấy Toast rồi mới chuyển về trang chủ
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        });
    </script>
</body>

</html>
