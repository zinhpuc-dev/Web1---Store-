<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - ZP Badminton</title>

    <link rel="icon" type="image/x-icon" href="../HinhAnh/Logo.ico">

    <link rel="stylesheet" href="../CSS/login.css">

</head>

<body>

    <header class="login-header">

        <a href="dashboard.html" class="logo">

            <img src="../HinhAnh/Logo_hinh.jpg" alt="ZP Badminton">

            <span>ZP Badminton</span>

        </a>

    </header>


    <main class="login-container">

        <section class="login-box">

            <div class="login-title">

                <h1>Đăng ký</h1>

                <p>
                    Tạo tài khoản khách hàng tại ZP Badminton
                </p>

            </div>


            <form>

                <div class="form-group">

                    <label for="fullname">
                        Họ và tên
                    </label>

                    <div class="input-box">

                        <input type="text" id="fullname" placeholder="Nhập họ và tên" required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <div class="input-box">

                        <input type="email" id="registerEmail" placeholder="Nhập email" required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Mật khẩu
                    </label>

                    <div class="input-box">

                        <input type="password" id="registerPassword" placeholder="Nhập mật khẩu" required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Xác nhận mật khẩu
                    </label>

                    <div class="input-box">

                        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>

                    </div>

                </div>


                <button type="button" class="login-button">

                    Đăng ký

                </button>

            </form>


            <div class="register-link">

                <span>
                    Đã có tài khoản?
                </span>

                <a href="login.html">
                    Đăng nhập
                </a>

            </div>


            <div class="back-home">

                <a href="dashboard.html">
                    ← Quay về trang chủ
                </a>

            </div>

        </section>

    </main>

</body>

</html>
