<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - ZP Badminton</title>

    <link rel="icon" type="image/x-icon" href="../HinhAnh/Logo.ico">
    <link rel="stylesheet" href="../CSS/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->

    <header class="login-header">

        <a href="dashboard.html" class="logo">
            <img src="../HinhAnh/Logo_hinh.jpg" alt="ZP Badminton">
            <span>ZP Badminton</span>
        </a>

    </header>


    <!-- LOGIN -->

    <main class="login-container">

        <section class="login-box">

            <div class="login-title">

                <h1>Đăng nhập</h1>

                <p>
                    Đăng nhập để tiếp tục mua sắm tại ZP Badminton
                </p>

            </div>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox" id="rememberLogin">

                        <span>
                            Ghi nhớ đăng nhập
                        </span>

                    </label>

                    <a href="#">
                        Quên mật khẩu?
                    </a>

                </div>


                <!-- ERROR -->

                <p id="loginError" class="login-error">
                </p>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="login-button">

                    Đăng nhập

                </button>


            </form>


            <!-- REGISTER -->

            <div class="register-link">

                <span>
                    Chưa có tài khoản?
                </span>

                <a href="register.html">
                    Đăng ký ngay
                </a>

            </div>


            <!-- BACK -->

            <div class="back-home">

                <a href="dashboard.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Quay về trang chủ

                </a>

            </div>

        </section>

    </main>


    <script src="../JS/login.js"></script>

</body>

</html>
