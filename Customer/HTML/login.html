<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - ZP Badminton</title>

    <link rel="icon" type="image/x-icon" href="../HinhAnh/Logo.ico">

    <link rel="stylesheet" href="../CSS/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="login-header">

        <div class="logo">
            <a href="dashboard.html">

                <img src="../HinhAnh/Logo_hinh.jpg" alt="Logo ZP Badminton">

                <span>ZP Badminton</span>

            </a>
        </div>

        <a href="dashboard.html" class="back-home">
            <i class="fa-solid fa-house"></i>
            Trang chủ
        </a>

    </header>


    <!-- LOGIN -->
    <main class="login-container">

        <div class="login-box">

            <!-- LOGO -->
            <div class="login-logo">

                <img src="../HinhAnh/Logo_hinh.jpg" alt="Logo">

                <h1>ZP Badminton</h1>

                <p>Đăng nhập tài khoản</p>

            </div>


            <!-- FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="username">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="username" name="username" placeholder="Nhập email của bạn" required>

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>

                        <i class="fa-solid fa-eye password-eye" id="togglePassword"></i>

                    </div>

                </div>


                <!-- REMEMBER -->
                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox" id="remember">

                        <span>Ghi nhớ đăng nhập</span>

                    </label>

                    <a href="#">
                        Quên mật khẩu?
                    </a>

                </div>


                <!-- BUTTON -->
                <button type="submit" class="login-button">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Đăng nhập

                </button>


                <!-- MESSAGE -->
                <p id="loginMessage" class="login-message"></p>

            </form>


            <!-- REGISTER -->
            <div class="register">

                <span>Chưa có tài khoản?</span>

                <a href="#">
                    Đăng ký ngay
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="login-footer">

        <p>
            © 2026 ZP Badminton. All rights reserved.
        </p>

    </footer>


    <script src="../JS/login.js"></script>

</body>

</html>
