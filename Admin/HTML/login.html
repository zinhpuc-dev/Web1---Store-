<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - ZP Badminton</title>
    <link rel="icon" type="image/x-icon" href="../HinhAnh/Logo.ico">
    <link rel="stylesheet" href="../CSS/common.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="admin-login-body">

    <div class="admin-login-wrap">

        <div class="admin-login-box">

            <div class="admin-login-logo">
                <img src="../HinhAnh/Logo_hinh.jpg" alt="ZP Admin">
            </div>

            <h1>ZP Admin</h1>
            <p class="admin-login-sub">Đăng nhập hệ thống quản trị</p>

            <form id="adminLoginForm" action="index.html" method="get">

                <div class="form-group">
                    <label for="adminEmail">
                        <i class="fa-solid fa-user"></i>
                        Email / Tài khoản
                    </label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="text" id="adminEmail" name="email" placeholder="admin@zpbadminton.com"
                            autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminPassword">
                        <i class="fa-solid fa-lock"></i>
                        Mật khẩu
                    </label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-key input-icon"></i>
                        <input type="password" id="adminPassword" name="password" placeholder="••••••••"
                            autocomplete="current-password">
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Hiện mật khẩu">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="admin-login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                </div>

                <button type="submit" class="admin-login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Đăng nhập
                </button>

                <p class="error-msg" id="adminLoginError"></p>

            </form>

            <p class="admin-login-footer">
                <i class="fa-solid fa-shield-halved"></i>
                Khu vực dành cho quản trị viên
            </p>

        </div>

    </div>

    <script>
        document.getElementById('togglePass').addEventListener('click', function () {
            var input = document.getElementById('adminPassword');
            var icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>

</body>

</html>
