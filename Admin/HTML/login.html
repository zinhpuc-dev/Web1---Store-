<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - ZP Badminton</title>
    <link rel="icon" type="image/x-icon" href="../HinhAnh/Logo.ico">
    <link rel="stylesheet" href="../CSS/common.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="admin-login-body">
    <div class="admin-login-box">
        <h1><i class="fa-solid fa-shield-halved"></i> Admin</h1>
        <p>Đăng nhập quản trị ZP Badminton</p>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Email / Tài khoản</label>
                <input type="text" id="adminEmail" placeholder="admin@zpbadminton.com" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>
            <button type="submit">Đăng nhập</button>
            <p class="error-msg" id="adminLoginError"></p>
        </form>
    </div>
    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("adminEmail").value.trim();
            const pass = document.getElementById("adminPassword").value.trim();
            const err = document.getElementById("adminLoginError");
            if (!email || !pass) { err.textContent = "Vui lòng nhập đầy đủ."; return; }
            // Giả lập: bất kỳ tài khoản nào cũng vào được (prototype)
            window.location.href = "dashboard.html";
        });
    </script>
</body>

</html>
